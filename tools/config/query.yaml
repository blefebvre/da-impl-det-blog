# Query index for implementationdetails.dev.
# Applied via the configuration service (not read from this repo):
#   curl -X POST https://admin.hlx.page/config/blefebvre/sites/da-impl-det-blog/content/query.yaml \
#     -H 'content-type: text/yaml' --data-binary @tools/config/query.yaml
# The blog-list block and the RSS feed read /query-index.json, keep only /blog/ pages with a
# `date`, and sort them by that original publish date (newest first).
version: 1
indices:
  default:
    include:
      - /**
    exclude:
      - /fragments/**
      - /nav
      - /footer
      - /thanks
      - /drafts/**
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="date"]
        value: attribute(el, "content")
      author:
        select: head > meta[name="author"]
        value: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, "content"), "https:\/\/[^/]+(/.*)")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
