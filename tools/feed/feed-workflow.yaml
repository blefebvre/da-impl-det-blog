# Copy to .github/workflows/feed.yaml to refresh /feed.xml daily from the query index.
name: Update RSS feed
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: node tools/feed/generate-feed.mjs
    - name: Commit feed if changed
      run: |
        if git diff --quiet -- feed.xml; then
          echo "feed.xml unchanged"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898+github-actions[bot]@users.noreply.github.com"
        git add feed.xml
        git commit -m "chore: update RSS feed"
        git push
